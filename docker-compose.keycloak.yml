# Addon compose file that adds a pre-configured Keycloak instance and points
# the backend at it. Run alongside the base file, never alone:
#
#   docker compose -f docker-compose.yml -f docker-compose.keycloak.yml up -d --build
#
# Keycloak imports keycloak/realm-export.json on first boot: a "twofa-example"
# realm with a confidential client ("twofa-backend") already registered for
# this app's callback URL, plus a demo user (demo@example.com / DemoPass123).
# No manual setup in the Keycloak admin console is required to try it out.
#
# The client secret below ("twofa-backend-secret-change-me", matching the one
# baked into realm-export.json) is committed in plaintext - that is only
# acceptable because this Keycloak instance is a disposable local sandbox with
# no real users. Never reuse a secret checked into git for a real deployment.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          timeout 3 cat <&3 | grep -q '"status": "UP"'
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    networks:
      - app-network

  backend:
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KEYCLOAK_ENABLED: "true"
      # Backend reaches Keycloak over the docker-compose network by service name...
      KEYCLOAK_ISSUER_URL: http://keycloak:8080/realms/twofa-example
      # ...but the browser has to be redirected to the host-mapped port instead.
      KEYCLOAK_PUBLIC_ISSUER_URL: http://localhost:${KEYCLOAK_PORT:-8080}/realms/twofa-example
      KEYCLOAK_ALLOW_INSECURE: "true"
      KEYCLOAK_CLIENT_ID: twofa-backend
      KEYCLOAK_CLIENT_SECRET: twofa-backend-secret-change-me
