name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency audit (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      # Report every workspace's audit result instead of cancelling the rest
      # as soon as one fails.
      fail-fast: false
      matrix:
        workspace: [backend, frontend, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.workspace }}
      - run: npm audit --audit-level=high
        working-directory: ${{ matrix.workspace }}

  security-scan:
    name: Semgrep security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" semgrep/semgrep \
            semgrep scan \
              --config p/security-audit --config p/secrets --config p/javascript --config p/nodejsscan \
              --exclude node_modules --exclude "*.md" \
              --error \
              /src

  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build

  image-scan:
    name: Trivy image scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      matrix:
        include:
          # npm ships its own bundled dependency tree (tar/glob/minimatch/...)
          # under the npm CLI's own node_modules, used only for package
          # management operations (install/extract) - never invoked by this
          # app's runtime code, so it's excluded rather than chased CVE by CVE.
          - service: backend
            skip_dirs: /usr/local/lib/node_modules/npm
          - service: frontend
            skip_dirs: /usr/local/lib/node_modules/npm
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t 2fa-example-${{ matrix.service }}:scan ./${{ matrix.service }}

      # Scans the built image itself (OS packages + language deps baked into
      # the final layers) - complements the `audit`/`security-scan` jobs above,
      # which only look at source and package.json, not what actually ends up
      # in the image (base image OS packages, transitive deps resolved at
      # build time, etc).
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 2fa-example-${{ matrix.service }}:scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          skip-dirs: ${{ matrix.skip_dirs }}

  smoke-test:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Generate throwaway secrets for this run
        run: bash scripts/generate-secrets.sh

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/api/health > /dev/null; then
              echo "backend is up"
              exit 0
            fi
            sleep 2
          done
          echo "backend did not become healthy in time" >&2
          exit 1

      - name: Run smoke tests
        run: bash scripts/smoke-test.sh

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  ui-test:
    name: Browser UI test (Playwright)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Generate throwaway secrets for this run
        run: bash scripts/generate-secrets.sh

      - name: Start stack
        run: docker compose up -d --build

      - name: Install Playwright + Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Wait for frontend proxy and backend health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173/api/health > /dev/null; then
              echo "stack is up"
              exit 0
            fi
            sleep 2
          done
          echo "stack did not become healthy in time" >&2
          exit 1

      - name: Run UI tests
        working-directory: e2e
        run: node ui-test.mjs

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
