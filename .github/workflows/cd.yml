name: CD

# Publishes versioned images so a deployment target can pull an exact,
# already-tested build instead of rebuilding from source. Intentionally does
# NOT deploy anywhere itself - see CI-CD.md for why that's left as a pluggable
# step (this is a learning repo with no fixed hosting target).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build & push (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/2fa-example-${{ matrix.service }}:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/2fa-example-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
